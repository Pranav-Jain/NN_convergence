name: test_convergence
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - numpy
  - pandas
  - scipy
  - matplotlib
  - tqdm
  - sympy

  # --- PyTorch with CUDA 12.1 (works with CUDA 12.2 driver) ---
  - pytorch=2.5
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1

  - pip
  - pip:
      - gpytoolbox
      - polyscope
      - bpy==4.3
      - libigl
